services:
  postgres:
    image: postgres:16
    container_name: dreambighealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dreambighealth
      POSTGRES_USER: market_access
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_access -d dreambighealth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
